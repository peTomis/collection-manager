<svg xmlns="http://www.w3.org/2000/svg" viewBox="1 -0.2 30 30">
  <!-- The logo mark (components/atoms/logo.tsx): amber for Pokémon, violet for Magic, ink for the collection -->
  <style>
    .ink { fill: #1d1b18 }
    .paper { fill: #fbfaf7 }
    rect { stroke: #fbfaf7 }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #f2efe8 }
      .paper { fill: #1d1b18 }
      rect { stroke: #1d1b18 }
    }
  </style>
  <rect x="9.5" y="5" width="13" height="18" rx="2.4" fill="#ad7300" stroke-width="1.4" transform="rotate(-20 16 27)"/>
  <rect x="9.5" y="5" width="13" height="18" rx="2.4" fill="#7860b5" stroke-width="1.4"/>
  <rect class="ink" x="9.5" y="5" width="13" height="18" rx="2.4" stroke-width="1.4" transform="rotate(20 16 27)"/>
  <rect class="paper" x="13.6" y="10.6" width="4.8" height="4.8" stroke-width="0" transform="rotate(20 16 27) rotate(45 16 13)"/>
</svg>
