name: CI

on:
  push:
    branches: [main]
  pull_request:
  # New advisories appear without any change here: audit weekly too
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  # The MongoDB binary of the database and end-to-end tests, cached between runs
  MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.mongodb-binaries

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The contract test (tests/contract.test.ts) reads the private backend repository when this secret is set:
      # a fine-grained token with read-only Contents access to it. Without it the test is skipped.
      HAS_BACKEND_TOKEN: ${{ secrets.BACKEND_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        if: env.HAS_BACKEND_TOKEN == 'true'
        with:
          repository: peTomis/collection-manager-backend
          token: ${{ secrets.BACKEND_TOKEN }}
          path: backend
      # Next to this repository, where the test looks for it, and out of this one's typecheck
      - if: env.HAS_BACKEND_TOKEN == 'true'
        run: mv backend ../collection-manager-backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - uses: actions/cache@v4
        with:
          path: .mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn test:coverage
      - run: yarn test:offline
      - name: Coverage summary
        if: always()
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
            console.log(["### Coverage (lib/, pages/api/)", "| | % | covered |", "| --- | --- | --- |", ...["lines", "statements", "branches", "functions"].map(row)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  e2e:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - uses: actions/cache@v4
        with:
          path: .mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
      - uses: actions/cache@v4
        id: playwright
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
      - run: yarn install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
        if: steps.playwright.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        if: steps.playwright.outputs.cache-hit == 'true'
      # Production build (e2e/build.mjs), then the journeys on desktop and phone layouts
      - run: yarn test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Fails on any known advisory, development tools included (they run on this machine and in CI)
      - run: yarn audit
